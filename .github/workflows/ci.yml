name: CI

on:
  push:
    branches: [master]
    # Nothing a push run executes reads these: no step, test or build input
    # opens docs/, bench/ (the benchmarks run in the full run only) or ci/ (lane
    # tools), and README.md is read only by the pack path, which is in the full
    # run as well. A commit that touches nothing else gets no push run and is
    # checked by the next full run. When a commit touches both, it runs.
    paths-ignore:
      - 'ansi-state.json'
      - 'bench-state.json'
      - 'docs/**'
      - 'bench/**'
      - 'ci/**'
      - '**.md'
  pull_request:
    branches: [master]
  # The full run by hand, e.g. before cutting a release.
  workflow_dispatch:

# Branches and pull requests: cancel the superseded run. Only the tip needs to
# be green.
#
# master: never cancel; queue. Every landed commit gets its own verdict, so a
# red master can be bisected from the run list instead of by hand. The push run
# is kept short (about 20 min, the rest is in the full run below) and landings
# are batched, so the queue drains instead of growing.
#
# The full run (schedule, workflow_dispatch) gets a group of its own per run,
# so a push never cancels it and it never cancels a push.
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('ci-full-{0}', github.run_id) || (github.ref == 'refs/heads/master' && format('ci-{0}-{1}', github.ref, github.sha) || format('ci-{0}', github.ref)) }}
  cancel-in-progress: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

jobs:
  # -- How the work is laid out -----------------------------------------------
  # The push run is the job `test` alone: one build and the push set, about
  # 20 min. Splitting it would only add a build per
  # extra job to every push.
  #
  # The full run is `test` and the five `full-*` jobs below, each with its own
  # checkout and build (~2 min each, the price of independence), each about 20
  # min or less, measured step by step. They do not depend on one another, so
  # the run takes as long as its longest job when there are as many runners as
  # jobs, and about half its total (~105 job-minutes) on two runners. Passing
  # the build between jobs as an artifact was not taken: it would put an upload
  # and a download where the build was, save little of the wall clock, and tie
  # every job to the one that builds.
  #
  # The job order below is the order the runners usually pick them up in. The
  # two short ones go last, so on two runners they fill the gap the long ones
  # leave instead of starting a third round.
  test:
    # The runner comes from the CI_RUNNER repository variable, falling back to
    # ubuntu-latest where it is unset. Keep the fallback: a repository without
    # the variable must still build on GitHub-hosted runners.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Push run about 23 min (regression 14, interpreter 3, builds 5); in the
    # full run this job is the build and the compiled suite at the full tier,
    # about 21 min. A job that dies at the ceiling reports as a failure of
    # whatever step happened to be running, which is the least informative red
    # there is, so the ceiling stays well above the measurement. A shared Linux
    # host under load ran this job 1.8x slower and 45 minutes cancelled it
    # twice, which says nothing about the code; 75 lets a slow run finish and
    # report a real result.
    timeout-minutes: 75
    # RUN_FULL selects the full run: the scheduled run, a run started by hand,
    # and a push to the public mirror (which moves only at releases, so a push
    # there IS the release gate). A push or pull request run is the push set:
    # build, the ns2.0 tripwire, and the regression suite compiled and under the
    # tree-walk interpreter, with its slowest child-process files left out
    # (DOTCL_REGRESSION_TIER below). In the full run this job runs the compiled
    # suite with every file loaded, and the rest of the full run is in the
    # full-* jobs below.
    #
    # What moved out of the push set on 2026-09-29, and why: the push run had
    # reached ~44 min on one runner, against a target of about 12. Moved to the
    # full run: the emit-free regression mode, the self-host fixpoint, the seed
    # build, ilverify, fasl shape, and the MSBuild / C# host / core boot / CLI /
    # PDB gates, plus the pack, build and REPL child-process regression files.
    # The gates had not caught a real defect on a push in their whole record (0
    # of 150 to 369 runs each; the two reds were test-side mistakes). The
    # emit-free mode (3 real defects), self-host (1) and seed (1) had, over two
    # months; moving them means such a defect now shows within 12 hours rather
    # than on its own push, and is bisected over the commits of that half day.
    # The ns2.0 tripwire (7 real defects) and the compiled and interpreted
    # regression runs stay on every push.
    env:
      RUN_FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.repository == 'dotcl/dotcl' && github.event_name == 'push') }}
      # Read by test/regression/run.lisp. "push" leaves out the files that are
      # slow and have never caught anything in the push run (see
      # LOAD-FULL-TIER-ONLY in test/framework.lisp); "full" loads every file,
      # which is also what a run by hand gets when the variable is unset.
      DOTCL_REGRESSION_TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.repository == 'dotcl/dotcl' && github.event_name == 'push')) && 'full' || 'push' }}
      # Read by the test/*/check.sh scripts. Each of them SKIPs (exit 0) when a
      # prerequisite is missing, which keeps them pleasant to run by hand on a
      # fresh clone -- and makes them useless here, because a skip and a pass
      # look identical in the step list. With this set, a skip is a failure.
      DOTCL_CI: "1"
      # The whole checkout is visible to ASDF, and nothing from the runner's own
      # configuration is: a run reads the same registry on every machine.
      CL_SOURCE_REGISTRY: '(:source-registry (:tree "${{ github.workspace }}/") :ignore-inherited-configuration)'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prune old NuGet packages
        if: runner.environment != 'github-hosted'
        run: dotnet run ci/prune-nuget.cs

      # A full disk fails a run somewhere unrelated, much later. Checked right
      # after the old runtime packs are pruned, on our own runners only (they
      # keep their disk between runs).
      - name: Free disk space
        if: runner.environment != 'github-hosted'
        run: |
          avail_kb=$(df -Pk / | awk 'NR == 2 { print $4 }')
          echo "$((avail_kb / 1024)) MB free on /"
          if [ "$avail_kb" -lt $((5 * 1024 * 1024)) ]; then
            echo "::error::Less than 5 GB free on /"
            df -h /
            du -sh "$HOME"/.nuget/packages/* 2>/dev/null | sort -rh | head -20
            exit 1
          fi

      - name: Runner info
        run: |
          echo "=== CPU ===" && lscpu | grep -E 'Model name|^CPU\(s\)|Thread'
          echo "=== Memory ===" && free -h
          echo "=== Disk ===" && df -h /
          # Arm the measurement the last step of this job reports. memory.peak
          # is a high-water mark that lives as long as the cgroup does, and the
          # runner is a long-lived service rather than a fresh container, so
          # without this reset the number would be the largest any job on this
          # machine ever reached. Resetting it by writing is a kernel >= 6.8
          # feature; when the write is refused nothing changes here and the
          # reporting step prints the ancestors' figures instead.
          cg=$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup 2>/dev/null || true)
          echo 0 > "/sys/fs/cgroup${cg}/memory.peak" 2>/dev/null \
            && echo "=== memory.peak reset: yes ===" \
            || echo "=== memory.peak reset: no (kernel < 6.8, or not writable) ==="

      # Every later bash step gets an empty XDG_CACHE_HOME of its own (bash reads
      # BASH_ENV first), so no step passes because an earlier one, or an earlier
      # run, left compiled fasls in the shared cache.
      - name: Per-step cache directory
        run: |
          cat > "$RUNNER_TEMP/step-env.sh" <<'EOF'
          export XDG_CACHE_HOME="$RUNNER_TEMP/xdg-cache/$GITHUB_ACTION"
          mkdir -p "$XDG_CACHE_HOME"
          EOF
          echo "BASH_ENV=$RUNNER_TEMP/step-env.sh" >> "$GITHUB_ENV"

      # A runner that keeps its home directory between runs already has this, so
      # install only when it is missing (saves ~30s per run where it persists).
      - name: Setup Roswell
        run: |
          if ! command -v ros >/dev/null && [ ! -x "$HOME/.roswell/bin/ros" ]; then
            curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          fi
          echo "$HOME/.roswell/bin" >> $GITHUB_PATH

      - name: Cross-compile
        run: make cross-compile

      - name: Build
        run: make build

      # Cheap tripwire (~60s): compile the emit-free netstandard2.0 runtime that
      # AOT/WebGL link against. `make build` only builds the dev net10 runner, so
      # an ns2.0-only break (unguarded Reflection.Emit / a BCL overload that ns2.0
      # does not have) would otherwise surface only in a heavy AOT/IL2CPP build.
      # Both repos, every push. Placed straight after Build: it is a compile, so
      # nothing below can influence it, and it reports at about minute 2.
      # In the full run it is in full-interp, beside the other ns2.0 checks.
      - name: Build emit-free ns2.0 runtime (tripwire)
        if: env.RUN_FULL != 'true'
        run: make build-ns2

      - name: Compile asdf FASL (required by some regression tests)
        run: make compile-asdf-fasl

      # contrib/dotnet-cs/lib/ (Roslyn and the helper DLL) for the inline-cs
      # regression tests. Without it they skip, which looked like a pass; in the
      # full run (DOTCL_CI=1, tier full) a missing lib/ now fails the suite
      # instead (test/regression/inline-cs-short-opcodes.lisp). Full run only:
      # it builds the runtime in Release for net10.0, which nothing else in the
      # job has done by this point. Roslyn comes from the NuGet cache, which the
      # pack step keeps warm on a runner that keeps its home directory.
      # ~10s on an M1 from a clean tree with a warm cache; about 1 min expected
      # here, going by the Build step.
      - name: Build contrib/dotnet-cs (full run; inline-cs regression tests)
        if: env.RUN_FULL == 'true'
        run: make contrib-dotnet-cs

      # DOTCL_REGRESSION_TIER (job env above) leaves the pack / build and piped
      # REPL files out of this and the next step on a push; the full run loads
      # them. The end of the run prints how many files it left out.
      #
      # Gating: catches Linux-only regressions on every push. Previously only the
      # release workflow ran test-regression, so a Linux-only break (e.g. a
      # registration-order bug that left generic-function-lambda-list returning NIL
      # only on Linux) slipped through master CI and surfaced only at release time.
      - name: Regression tests
        run: make test-regression

      # The same suite with EVAL routed through the emit-free tree-walk
      # interpreter. That interpreter is the ONLY evaluator on the netstandard2.0
      # build below, which CI merely COMPILES: so until this step it had never
      # been executed here at all, and it was broken: interpreted DEFPACKAGE
      # signalled "Undefined function: %MAKE-PACKAGE", multi-threaded EVAL
      # deadlocked, and an unmatched THROW killed the process outright.
      # Compile-time-diagnostic tests opt out via DEFTEST-COMPILED-ONLY.
      # In the full run it is in full-interp, so this job stays near 20 min.
      - name: Regression tests (tree-walk interpreter)
        if: env.RUN_FULL != 'true'
        run: make test-regression-interp

      - name: Disk usage (after)
        if: always()
        run: df -h / && du -sh out/ansi 2>/dev/null || true

      # What this job actually costs in memory, written to the step summary.
      # Informational only; the script cannot fail the job. Every job of the
      # full run reports it, which is what sizes a runner that takes two jobs at
      # once.
      - name: Memory peak (informational)
        if: always()
        run: sh scripts/ci-memory-report.sh

  # -- Full run: the evaluators and the ns2.0 path ------------------------------
  # Everything about the runtime that AOT / IL2CPP / WebGL ship: the ns2.0
  # compile, the suite under the interpreter and on the emit-free build, the
  # IL verifier, the in-memory core boot, and the suite under GC stress.
  # Two jobs, because as one it ran into its 75 minute ceiling on a loaded
  # shared host (interpreter 30 min, emit-free 28, ilverify 4.5, core boot 2,
  # then GC stress): full-interp is the interpreter suite, the ns2.0 tripwire,
  # ilverify and the in-memory core boot; full-emitfree is the emit-free suite
  # and GC stress. Both repeat the build, the asdf FASL and contrib/dotnet-cs
  # (about 8 min each), so the pair costs about 8 min more machine time than
  # the one job did, and neither is near its ceiling.
  full-interp:
    name: full (interpreter, ilverify, core boot)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.repository == 'dotcl/dotcl' && github.event_name == 'push')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 75
    env:
      DOTCL_REGRESSION_TIER: full
      DOTCL_CI: "1"
      CL_SOURCE_REGISTRY: '(:source-registry (:tree "${{ github.workspace }}/") :ignore-inherited-configuration)'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prune old NuGet packages
        if: runner.environment != 'github-hosted'
        run: dotnet run ci/prune-nuget.cs

      # As in the test job.
      - name: Free disk space
        if: runner.environment != 'github-hosted'
        run: |
          avail_kb=$(df -Pk / | awk 'NR == 2 { print $4 }')
          echo "$((avail_kb / 1024)) MB free on /"
          if [ "$avail_kb" -lt $((5 * 1024 * 1024)) ]; then
            echo "::error::Less than 5 GB free on /"
            df -h /
            du -sh "$HOME"/.nuget/packages/* 2>/dev/null | sort -rh | head -20
            exit 1
          fi

      - name: Runner info
        run: |
          echo "=== CPU ===" && lscpu | grep -E 'Model name|^CPU\(s\)|Thread'
          echo "=== Memory ===" && free -h
          echo "=== Disk ===" && df -h /
          cg=$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup 2>/dev/null || true)
          echo 0 > "/sys/fs/cgroup${cg}/memory.peak" 2>/dev/null \
            && echo "=== memory.peak reset: yes ===" \
            || echo "=== memory.peak reset: no (kernel < 6.8, or not writable) ==="

      # As in the test job.
      - name: Per-step cache directory
        run: |
          cat > "$RUNNER_TEMP/step-env.sh" <<'EOF'
          export XDG_CACHE_HOME="$RUNNER_TEMP/xdg-cache/$GITHUB_ACTION"
          mkdir -p "$XDG_CACHE_HOME"
          EOF
          echo "BASH_ENV=$RUNNER_TEMP/step-env.sh" >> "$GITHUB_ENV"

      - name: Setup Roswell
        run: |
          if ! command -v ros >/dev/null && [ ! -x "$HOME/.roswell/bin/ros" ]; then
            curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          fi
          echo "$HOME/.roswell/bin" >> $GITHUB_PATH

      - name: Cross-compile
        run: make cross-compile

      - name: Build
        run: make build

      - name: Compile asdf FASL (required by some regression tests)
        run: make compile-asdf-fasl

      # contrib/dotnet-cs/lib/ (Roslyn and the helper DLL) for the inline-cs
      # regression tests. Without it they skip, which looked like a pass; in the
      # full run (DOTCL_CI=1, tier full) a missing lib/ now fails the suite
      # instead (test/regression/inline-cs-short-opcodes.lisp). The full tier
      # needs it: it builds the runtime in Release for net10.0, which nothing
      # else in the job has done by this point. Roslyn comes from the NuGet cache, which the
      # pack step keeps warm on a runner that keeps its home directory.
      # ~10s on an M1 from a clean tree with a warm cache; about 1 min expected
      # here, going by the Build step.
      - name: Build contrib/dotnet-cs (full run; inline-cs regression tests)
        run: make contrib-dotnet-cs

      # The ns2.0 tripwire; in the push run it is in the job test.
      - name: Build emit-free ns2.0 runtime (tripwire)
        run: make build-ns2

      # The same suite with EVAL routed through the emit-free tree-walk
      # interpreter; see the push run's step in the job test.
      - name: Regression tests (tree-walk interpreter)
        run: make test-regression-interp

      # Assert the emitted CIL is VERIFIABLE, not merely JIT-acceptable: CoreCLR
      # tolerates a covariant call or an i4 where an i8 is wanted, IL2CPP/WebGL
      # do not, and a 25-minute AOT build is a terrible place to find out. The
      # target exists since the emitter was written but nothing ran it, so two
      # such defects sat in every fasl (a covariant Symbol call in non-top-level
      # DEFUN, an i4 default radix in DIGIT-CHAR-P) until a real library was put
      # through it. It now verifies the core, the stress fixture, and asdf.
      - name: Verify emitted CIL (ilverify)
        run: |
          dotnet tool install --global dotnet-ilverify >/dev/null 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          make ilverify

      # Booting from a core held in memory -- the only way in for a host with no
      # filesystem, and the only way in at all for the emit-free runtime. ~25s.
      - name: In-memory core boot
        run: make test-core-bytes

      - name: Disk usage (after)
        if: always()
        run: df -h / && du -sh out/ansi 2>/dev/null || true

      - name: Memory peak (informational)
        if: always()
        run: sh scripts/ci-memory-report.sh


  full-emitfree:
    name: full (emit-free, GC stress)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.repository == 'dotcl/dotcl' && github.event_name == 'push')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 75
    env:
      DOTCL_REGRESSION_TIER: full
      DOTCL_CI: "1"
      CL_SOURCE_REGISTRY: '(:source-registry (:tree "${{ github.workspace }}/") :ignore-inherited-configuration)'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prune old NuGet packages
        if: runner.environment != 'github-hosted'
        run: dotnet run ci/prune-nuget.cs

      # As in the test job.
      - name: Free disk space
        if: runner.environment != 'github-hosted'
        run: |
          avail_kb=$(df -Pk / | awk 'NR == 2 { print $4 }')
          echo "$((avail_kb / 1024)) MB free on /"
          if [ "$avail_kb" -lt $((5 * 1024 * 1024)) ]; then
            echo "::error::Less than 5 GB free on /"
            df -h /
            du -sh "$HOME"/.nuget/packages/* 2>/dev/null | sort -rh | head -20
            exit 1
          fi

      - name: Runner info
        run: |
          echo "=== CPU ===" && lscpu | grep -E 'Model name|^CPU\(s\)|Thread'
          echo "=== Memory ===" && free -h
          echo "=== Disk ===" && df -h /
          cg=$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup 2>/dev/null || true)
          echo 0 > "/sys/fs/cgroup${cg}/memory.peak" 2>/dev/null \
            && echo "=== memory.peak reset: yes ===" \
            || echo "=== memory.peak reset: no (kernel < 6.8, or not writable) ==="

      # As in the test job.
      - name: Per-step cache directory
        run: |
          cat > "$RUNNER_TEMP/step-env.sh" <<'EOF'
          export XDG_CACHE_HOME="$RUNNER_TEMP/xdg-cache/$GITHUB_ACTION"
          mkdir -p "$XDG_CACHE_HOME"
          EOF
          echo "BASH_ENV=$RUNNER_TEMP/step-env.sh" >> "$GITHUB_ENV"

      - name: Setup Roswell
        run: |
          if ! command -v ros >/dev/null && [ ! -x "$HOME/.roswell/bin/ros" ]; then
            curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          fi
          echo "$HOME/.roswell/bin" >> $GITHUB_PATH

      - name: Cross-compile
        run: make cross-compile

      - name: Build
        run: make build

      - name: Compile asdf FASL (required by some regression tests)
        run: make compile-asdf-fasl

      # contrib/dotnet-cs/lib/ (Roslyn and the helper DLL) for the inline-cs
      # regression tests. Without it they skip, which looked like a pass; in the
      # full run (DOTCL_CI=1, tier full) a missing lib/ now fails the suite
      # instead (test/regression/inline-cs-short-opcodes.lisp). The full tier
      # needs it: it builds the runtime in Release for net10.0, which nothing
      # else in the job has done by this point. Roslyn comes from the NuGet cache, which the
      # pack step keeps warm on a runner that keeps its home directory.
      # ~10s on an M1 from a clean tree with a warm cache; about 1 min expected
      # here, going by the Build step.
      - name: Build contrib/dotnet-cs (full run; inline-cs regression tests)
        run: make contrib-dotnet-cs

      # The suite on a runtime built WITHOUT Reflection.Emit (-p:DotclNoEmit),
      # which is what AOT / IL2CPP / WebGL / netstandard2.0 ship. The step above
      # only swaps the evaluator; this one removes the emitter from the build, so
      # it also covers the runtime functions a compiled call site would otherwise
      # have inlined past. Nothing ran it before and it was red: `(/ 1.0d0 0.0d0)`
      # signalled here while the compiled path returned an infinity, so a file
      # that builds an infinity could not even load.
      #
      # One known intermittent failure remains, and it is a real one rather than
      # a flaky test: concurrent add-method / remove-method can corrupt a hash
      # table that is not synchronized. It has only ever been seen while another
      # heavy build shared the machine -- ten clean runs on a quiet one -- so a
      # red here is worth reading rather than re-running.
      #
      - name: Regression tests (emit-free build)
        run: make test-regression-emitfree

      # The regression files that touch threads, frames, multiple values,
      # structures, CLOS and conditions, run with a tiny gen0 budget (GC very
      # often) both from the CLI and from a C# host that has used up .NET's small
      # TLS block first. A frame-chain head kept at the address of a TLS field
      # that the GC could move went unnoticed for weeks: the CLI always got the
      # fixed TLS block, a host (MSBuild, an ASP.NET app) did not. ~1.5 min.
      - name: Regression under GC stress (CLI and C# host)
        run: make test-gc-stress

      - name: Disk usage (after)
        if: always()
        run: df -h / && du -sh out/ansi 2>/dev/null || true

      - name: Memory peak (informational)
        if: always()
        run: sh scripts/ci-memory-report.sh

  # -- Full run: the release pack path ----------------------------------------
  # The pack, the nuspec rules and the library packages built from it, then
  # the ProjectCore MSBuild tasks, which reuse the contrib fasls the pack
  # built. ~20 min, most of it the pack.
  full-pack:
    name: full (pack path)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.repository == 'dotcl/dotcl' && github.event_name == 'push')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 75
    env:
      DOTCL_REGRESSION_TIER: full
      DOTCL_CI: "1"
      CL_SOURCE_REGISTRY: '(:source-registry (:tree "${{ github.workspace }}/") :ignore-inherited-configuration)'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prune old NuGet packages
        if: runner.environment != 'github-hosted'
        run: dotnet run ci/prune-nuget.cs

      # As in the test job.
      - name: Free disk space
        if: runner.environment != 'github-hosted'
        run: |
          avail_kb=$(df -Pk / | awk 'NR == 2 { print $4 }')
          echo "$((avail_kb / 1024)) MB free on /"
          if [ "$avail_kb" -lt $((5 * 1024 * 1024)) ]; then
            echo "::error::Less than 5 GB free on /"
            df -h /
            du -sh "$HOME"/.nuget/packages/* 2>/dev/null | sort -rh | head -20
            exit 1
          fi

      - name: Runner info
        run: |
          echo "=== CPU ===" && lscpu | grep -E 'Model name|^CPU\(s\)|Thread'
          echo "=== Memory ===" && free -h
          echo "=== Disk ===" && df -h /
          cg=$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup 2>/dev/null || true)
          echo 0 > "/sys/fs/cgroup${cg}/memory.peak" 2>/dev/null \
            && echo "=== memory.peak reset: yes ===" \
            || echo "=== memory.peak reset: no (kernel < 6.8, or not writable) ==="

      # As in the test job.
      - name: Per-step cache directory
        run: |
          cat > "$RUNNER_TEMP/step-env.sh" <<'EOF'
          export XDG_CACHE_HOME="$RUNNER_TEMP/xdg-cache/$GITHUB_ACTION"
          mkdir -p "$XDG_CACHE_HOME"
          EOF
          echo "BASH_ENV=$RUNNER_TEMP/step-env.sh" >> "$GITHUB_ENV"

      - name: Setup Roswell
        run: |
          if ! command -v ros >/dev/null && [ ! -x "$HOME/.roswell/bin/ros" ]; then
            curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          fi
          echo "$HOME/.roswell/bin" >> $GITHUB_PATH

      - name: Cross-compile
        run: make cross-compile

      - name: Build
        run: make build

      # -- Walk the release pack path without a tag -------------------------
      # release.yml runs `make pack` only on a tag push, so a break anywhere in
      # the packaging chain (a renamed R2R artifact, a csproj glob, a dropped
      # staging step) surfaced for the first time AFTER the tag was already
      # pushed, forcing a re-tag. v0.1.28 was cut twice for exactly that.
      #
      # One RID walks the whole chain: crossgen2, the runtime/ staging, both
      # packs and the cleanup afterwards. Only that RID's tool package (and the
      # any-RID one) is built. ~11-14 min, so it is in the full run
      # only. On the public mirror a push is a release, so it runs there too.
      # The two `test -f` lines are the point: a pack that exits 0 without
      # producing the base pointer or the per-RID package is the failure mode
      # that reaches a release. `make pack` itself also fails if a tool package
      # (dotcl, dotcl.<rid>, dotcl.any) lists a dependency: test/pack-nuspec/tool-deps.sh.
      #
      # The version is throwaway but not arbitrary: `dotcl pack` refuses a --from
      # payload older than the first release whose runtime loads a loose user
      # fasl (PackRestamp.LoaderFloor), and it reads that off the version string,
      # so a 0.0.0 donor is refused however new the bits actually are. The step
      # below packs from this one.
      - name: Pack path (full run, one RID)
        run: |
          make pack \
            R2R_RIDS=linux-x64 \
            PACK_VERSION=0.1.99-nightly \
            PACK_ARGS="-p:DotclToolNoAndroid=true -p:DotclToolRid=linux-x64"
          test -f out/dotcl.0.1.99-nightly.nupkg
          test -f out/dotcl.linux-x64.0.1.99-nightly.nupkg
          ls -l out/*0.1.99-nightly*.nupkg

      # `make pack` builds the nuspec from the project; this asserts the field
      # rules (donor fields dropped when unsupplied, required fields refused
      # rather than inherited) without publishing anything. ~20s.
      #
      # It needs a directory of published dotcl packages to restamp, and its
      # check.sh SKIPs when there is none -- which is what it did in EVERY run
      # it was ever enabled for: it sat above the step that produces them, so
      # `out/` was always empty and the step finished in 4 seconds wearing a
      # passing face. It now runs directly after the pack above, on the same
      # condition, using those packages as the donor. That is also why it is not
      # one of the every-push gates: the donor costs minutes to make.
      - name: Pack nuspec rules (full run; donor = the packages above)
        run: make test-pack-nuspec

      # A library packed with `dotcl pack --library` onto a local feed and loaded
      # by another project through (:nuget ...), using the dotcl tool installed
      # from the packages above, as a user has it. It fails, rather than skips,
      # without them (DOTCL_CI=1), and checks the consumer compiled only its own
      # file: the library's fasls came from the package. No network. ~5s on an
      # M1 with the tool install, so ~10s here.
      - name: Library package end to end (full run; dotcl = the packages above)
        run: make test-pack-library-e2e

      # The same library packed by the previous released dotcl (installed from
      # nuget.org, PREVIOUS_DOTCL_VERSION in the Makefile) and loaded by the tool
      # above: the old fasls have to be used as they are and run, after one
      # warning line per package. Catches a runtime change that breaks fasls
      # already published. ~7s on an M1 including the download, so ~20s here.
      - name: Library package from the previous release (full run)
        run: make test-pack-library-previous

      # Cleanup is its own step so it also runs when the steps above fail: `out/`
      # and the staged runtime/contrib are hundreds of MB on a runner that keeps
      # its disk between runs.
      - name: Clean up pack artifacts
        if: always()
        run: rm -rf out runtime/contrib

      # The other half of the MSBuild story: the Project composition step in
      # full-hosts builds with the legacy targets (external process), this one
      # with the ProjectCore targets driving the in-process tasks -- the
      # configuration every NuGet consumer gets, and the only one that executes
      # DotCL.Build.Tasks.dll at all. Also the gate on what a failing build TELLS
      # the user: a dependency that cannot be found is the first wall a new user
      # hits, and the remedy is a build property they have no reason to know
      # about. Here, after the pack, the contrib fasls it needs are already built
      # (~3.5 min; it would cost several more in a job that had to build them
      # first).
      - name: Project-core MSBuild tasks
        run: make test-project-core-build

      - name: Disk usage (after)
        if: always()
        run: df -h / && du -sh out/ansi 2>/dev/null || true

      - name: Memory peak (informational)
        if: always()
        run: sh scripts/ci-memory-report.sh

  # -- Full run: ANSI, the random differential test, the benchmarks -----------
  # With the two small CLHS / AMOP suites that ansi-test does not reach. The
  # benchmarks go last. ~20 min.
  full-ansi-bench:
    name: full (ANSI, random, bench)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.repository == 'dotcl/dotcl' && github.event_name == 'push')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 75
    env:
      DOTCL_REGRESSION_TIER: full
      DOTCL_CI: "1"
      CL_SOURCE_REGISTRY: '(:source-registry (:tree "${{ github.workspace }}/") :ignore-inherited-configuration)'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prune old NuGet packages
        if: runner.environment != 'github-hosted'
        run: dotnet run ci/prune-nuget.cs

      # As in the test job.
      - name: Free disk space
        if: runner.environment != 'github-hosted'
        run: |
          avail_kb=$(df -Pk / | awk 'NR == 2 { print $4 }')
          echo "$((avail_kb / 1024)) MB free on /"
          if [ "$avail_kb" -lt $((5 * 1024 * 1024)) ]; then
            echo "::error::Less than 5 GB free on /"
            df -h /
            du -sh "$HOME"/.nuget/packages/* 2>/dev/null | sort -rh | head -20
            exit 1
          fi

      - name: Runner info
        run: |
          echo "=== CPU ===" && lscpu | grep -E 'Model name|^CPU\(s\)|Thread'
          echo "=== Memory ===" && free -h
          echo "=== Disk ===" && df -h /
          cg=$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup 2>/dev/null || true)
          echo 0 > "/sys/fs/cgroup${cg}/memory.peak" 2>/dev/null \
            && echo "=== memory.peak reset: yes ===" \
            || echo "=== memory.peak reset: no (kernel < 6.8, or not writable) ==="

      # As in the test job.
      - name: Per-step cache directory
        run: |
          cat > "$RUNNER_TEMP/step-env.sh" <<'EOF'
          export XDG_CACHE_HOME="$RUNNER_TEMP/xdg-cache/$GITHUB_ACTION"
          mkdir -p "$XDG_CACHE_HOME"
          EOF
          echo "BASH_ENV=$RUNNER_TEMP/step-env.sh" >> "$GITHUB_ENV"

      - name: Setup Roswell
        run: |
          if ! command -v ros >/dev/null && [ ! -x "$HOME/.roswell/bin/ros" ]; then
            curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          fi
          echo "$HOME/.roswell/bin" >> $GITHUB_PATH

      - name: Cross-compile
        run: make cross-compile

      - name: Build
        run: make build

      # CLHS-audit tests for behaviour ansi-test does not reach (the
      # with-standard-io-syntax variable table, pprint dispatch, read-sequence
      # bounds). ~10s.
      - name: CLHS audit extras
        run: make test-ansi-extra

      # AMOP protocol conformance: the metaobject generic functions real
      # libraries call. ~10s.
      - name: MOP protocol tests
        run: make test-mop

      # Fetching ansi-test is its own step so a failure there is reported as
      # what it is. It used to be a prerequisite of the run below, whose `|| true`
      # (there so a known ANSI failure does not fail the build) also swallowed a
      # failed clone: the suite then ran zero categories, reported success, and
      # the run went red three steps later inside the summary formatter.
      - name: Fetch ansi-test
        run: make setup-ansi-test

      # No `|| true`: the suite's own result is judged by the gate below (a known
      # failure must not fail this step), but everything else this command can
      # fail for -- the build, a missing runtime, the clone -- was being swallowed
      # too, which is how the run stayed green while reporting nothing.
      # Outputs land in out/ansi inside the workspace (ANSI_OUT in the
      # Makefile), not in /tmp, which a persistent runner shares across jobs.
      - name: ANSI tests
        run: mkdir -p out/ansi && make test-ansi-all STDBUF="stdbuf -oL" 2>&1 | tee out/ansi/summary.txt

      - name: Generate failure details
        if: always()
        run: |
          for f in out/ansi/ansi-*.txt; do
            [ -f "$f" ] || continue
            grep -a -A 8 "^Test .* failed" "$f" 2>/dev/null | grep -a -E "^Test .* failed|^Form:|^Expected|^Actual|^          " | grep -v "^--$"
          done > out/ansi/failures.txt || true

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansi-test-outputs
          path: |
            out/ansi/ansi-*.txt
            out/ansi/failures.txt
            out/ansi/summary.txt

      # The gate: the set of failing test names must be the set ansi-state.json
      # records. Not a count -- ansi-test is an upstream clone whose total moves
      # on its own, so a real regression can arrive in a run whose count is
      # unchanged. Runs after the outputs are uploaded (so a red is diagnosable
      # from the artifact) and BEFORE the state file is regenerated below, which
      # would otherwise rewrite the very record being checked.
      - name: ANSI gate
        run: make test-ansi-gate

      - name: Update ansi-state.json
        run: make update-ansi-state

      # Random differential test (test/random/): 1000 fresh random integer
      # forms with the typed shapes (declarations, specialized arrays, local
      # functions; test/random/typed.lisp), each checked inside dotcl (optimized
      # against notinline) and
      # replayed on SBCL (Roswell, installed above) with the results diffed.
      # The forms differ on every run, so a red here is a new finding rather
      # than a regression of a known case: the uploaded cases.lsp and
      # self-discrepancies.lsp reproduce it. Full run only.
      - name: Random differential test
        run: make test-random-forms RANDOM_N=1000 RANDOM_TYPED=1

      - name: Upload random differential test outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: random-forms-outputs
          path: out/random-forms/

      # A tree without bench/cl-bench-runner/run.lisp gives this step no inputs, and it used to
      # run anyway on RUN_FULL alone and fail every time, kept green by the
      # `|| true`: a step that could never succeed, wearing a passing face.
      # Gate on the file instead, so it runs exactly where it can work and is
      # honestly reported as skipped elsewhere.
      # The `|| true` stays on purpose: benchmarks are data collection, not a
      # gate, and a slow or missing SBCL must not fail the build.
      # Benchmarks do not run on GitHub-hosted runners. A time ratio depends on
      # the CPU, and hosted runners hand out different CPUs from run to run
      # (EPYC 7763, 9V74, 9V45 seen within a week), so a baseline recorded on
      # one cannot judge another: the gate either misses real regressions or
      # fails on the luck of the draw. The baselines in
      # bench/gate/ratio-baseline.json each belong to one fixed machine.
      # The full run's jobs go to whichever runner is free, so when runners
      # other than the measured ones are attached, the repository variable
      # BENCH_RUNNERS (comma-separated runner names) limits both benchmark
      # steps to the named ones; unset, any runner of ours runs them.
      - name: Benchmarks
        if: hashFiles('bench/cl-bench-runner/run.lisp') != '' && runner.environment != 'github-hosted' && (vars.BENCH_RUNNERS == '' || contains(format(',{0},', vars.BENCH_RUNNERS), format(',{0},', runner.name)))
        run: make bench-state || true

      # Unlike the step above, this one is a gate and has no `|| true`. It can
      # be: it compares dotcl against a C# program in this repository, so there
      # is no external toolchain to be missing, and the check itself is a
      # comparison against recorded ratios in bench/gate/ratio-baseline.json rather
      # than against absolute times.
      #
      # It runs after `make bench-state` on purpose. bench-parity merges into
      # the same bench-state.json, so running it second means the cl-bench rows
      # are present and the median half of the check has something to work with.
      #
      # A measurement with no recorded baseline is printed in the format the
      # baseline file wants. That is how a new runner gets its first numbers:
      # read them out of this step's log and commit them.
      #
      # When any measurement it took had no baseline, check-ratios.sh says
      # UNJUDGED and exits 3 rather than ok. All 9 linux-x64 measurements (8 parity kernels
      # plus the cl-bench median) now have a baseline in
      # bench/gate/ratio-baseline.json, so this gate judges every measurement it
      # produces and CHECK_RATIOS_ALLOW_UNJUDGED is not needed here. If a new
      # kernel is added to bench/csharp-parity/kernels.lisp without a matching
      # linux-x64 entry, this step goes back to failing (exit 3) until one is
      # recorded; that is intentional, not a regression to work around by
      # re-adding the variable.
      - name: Benchmark ratio gate
        if: hashFiles('bench/csharp-parity/kernels.lisp') != '' && runner.environment != 'github-hosted' && (vars.BENCH_RUNNERS == '' || contains(format(',{0},', vars.BENCH_RUNNERS), format(',{0},', runner.name)))
        run: make bench-parity

      - name: Show results
        if: always()
        run: |
          {
            echo "## ANSI Test Results"
            echo ""
            if [ -f out/ansi/summary.txt ]; then
              echo '### Per-category (pass / elapsed / alloc)'
              echo '```'
              # Keep only result + TOTAL lines, drop build noise. The `|| echo`
              # matters: this step runs under `set -e`, so a grep that matches
              # nothing (a run that produced no category lines at all) would fail
              # the job here: pointing at the summary formatter instead of at
              # whatever actually went wrong upstream. Reporting must never
              # decide the colour of the run.
              grep -E '^(cons|strings|sequences|data-and-control-flow|hash-tables|symbols|arrays|types-and-classes|characters|pathnames|files|system-construction|iteration|eval-and-compile|conditions|printer|environment|structures|packages|objects|reader|numbers|streams|misc):|^TOTAL:|^GC TOTAL:' out/ansi/summary.txt \
                || echo '(no per-category lines; see the ANSI step output)'
              echo '```'
              echo ''
            fi
            if [ -f ansi-state.json ]; then
              echo '```json'
              cat ansi-state.json
              echo '```'
            else
              echo "ansi-state.json not generated"
            fi
            echo ""
            echo "## Failed Tests (details)"
            echo ""
            if [ -s out/ansi/failures.txt ]; then
              echo '```'
              head -1000 out/ansi/failures.txt
              echo '```'
            else
              echo "No failures found in output files"
            fi
            echo ""
            echo "## Benchmark Results"
            echo ""
            if [ -f bench-state.json ]; then
              echo '```json'
              cat bench-state.json
              echo '```'
            else
              echo "bench-state.json not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disk usage (after)
        if: always()
        run: df -h / && du -sh out/ansi 2>/dev/null || true

      - name: Memory peak (informational)
        if: always()
        run: sh scripts/ci-memory-report.sh

  # -- Full run: the build chain and the compiler's output ---------------------
  # Does the tree reproduce itself, can a released dotcl build it, is the fasl
  # loadable, and what a script run and the PDB look like from outside. ~8 min:
  # one of the two short jobs that fill in on two runners.
  full-selfhost:
    name: full (self-host, seed, fasl shape, CLI, PDB)
