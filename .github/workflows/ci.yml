name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'ansi-state.json'
      - 'bench-state.json'
      - 'docs/decisions/**'
  pull_request:
    branches: [master]
  schedule:
    # Nightly full ANSI + bench (03:00 JST = 18:00 UTC).
    - cron: '0 18 * * *'

# Cancel superseded in-flight runs per ref so a burst of pushes doesn't each
# spawn a full ~15-min run; only the tip finishes (no coverage loss on the
# landed commit).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Full ANSI + bench runs on every push to dotcl/dotcl and on the nightly
    # schedule; other pushes run only the cheap gates below.
    env:
      RUN_FULL: ${{ github.repository == 'dotcl/dotcl' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Runner info
        run: |
          echo "=== CPU ===" && lscpu | grep -E 'Model name|^CPU\(s\)|Thread'
          echo "=== Memory ===" && free -h
          echo "=== Disk ===" && df -h /

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Roswell
        run: |
          if ! command -v ros >/dev/null && [ ! -x "$HOME/.roswell/bin/ros" ]; then
            curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          fi
          echo "$HOME/.roswell/bin" >> $GITHUB_PATH

      - name: Cross-compile
        run: make cross-compile

      - name: Build
        run: make build

      - name: Self-host fixpoint
        run: make selfhost-check

      - name: Compile asdf FASL (required by some regression tests)
        run: make compile-asdf-fasl

      # Gating: catches Linux-only regressions on every push. Previously only the
      # release workflow ran test-regression, so a Linux-only break (e.g. a
      # registration-order bug that left generic-function-lambda-list returning NIL
      # only on Linux) slipped through master CI and surfaced only at release time.
      - name: Regression tests
        run: make test-regression

      # The same suite with EVAL routed through the emit-free tree-walk
      # interpreter. That interpreter is the ONLY evaluator on the netstandard2.0
      # build below, which CI merely COMPILES — so until this step it had never
      # been executed here at all, and it was broken: interpreted DEFPACKAGE
      # signalled "Undefined function: %MAKE-PACKAGE", multi-threaded EVAL
      # deadlocked, and an unmatched THROW killed the process outright.
      # Compile-time-diagnostic tests opt out via DEFTEST-COMPILED-ONLY.
      - name: Regression tests (tree-walk interpreter)
        run: make test-regression-interp

      # Cheap tripwire (~25s): compile the emit-free netstandard2.0 runtime that
      # AOT/WebGL link against. `make build` only builds the dev net10 runner, so
      # an ns2.0-only break (unguarded Reflection.Emit / broken DOTCL_NO_JSON)
      # would otherwise surface only in a heavy AOT/IL2CPP build. Both repos,
      # every push.
      - name: Build emit-free ns2.0 runtime (tripwire)
        run: make build-ns2

      # Assert the emitted CIL is VERIFIABLE, not merely JIT-acceptable: CoreCLR
      # tolerates a covariant call or an i4 where an i8 is wanted, IL2CPP/WebGL
      # do not, and a 25-minute AOT build is a terrible place to find out. The
      # target exists since the emitter was written but nothing ran it, so two
      # such defects sat in every fasl (a covariant Symbol call in non-top-level
      # DEFUN, an i4 default radix in DIGIT-CHAR-P) until a real library was put
      # through it. It now verifies the core, the stress fixture, and asdf.
      - name: Verify emitted CIL (ilverify)
        run: |
          dotnet tool install --global dotnet-ilverify >/dev/null 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          make ilverify

      - name: ANSI tests
        if: env.RUN_FULL == 'true'
        run: make test-ansi-all STDBUF="stdbuf -oL" 2>&1 | tee /tmp/ansi-summary.txt || true

      - name: Generate failure details
        if: ${{ always() && env.RUN_FULL == 'true' }}
        run: |
          for f in /tmp/ansi-*.txt; do
            [ -f "$f" ] || continue
            grep -a -A 8 "^Test .* failed" "$f" 2>/dev/null | grep -a -E "^Test .* failed|^Form:|^Expected|^Actual|^          " | grep -v "^--$"
          done > /tmp/ansi-failures.txt || true

      - name: Upload test outputs
        if: ${{ always() && env.RUN_FULL == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ansi-test-outputs
          path: |
            /tmp/ansi-*.txt
            /tmp/ansi-failures.txt
            /tmp/ansi-summary.txt

      - name: Update ansi-state.json
        if: env.RUN_FULL == 'true'
        run: make update-ansi-state

      # bench/ is mirror-excluded, so on the public repo this step has no inputs.
      # RUN_FULL alone is true there, so it used to run on every public push and
      # fail every time, kept green by the `|| true` — a step that could never
      # succeed, wearing a passing face. Gate on the file instead, so it runs
      # exactly where it can work and is honestly reported as skipped elsewhere.
      # The `|| true` stays on purpose: benchmarks are data collection, not a
      # gate, and a slow or missing SBCL must not fail the build.
      - name: Benchmarks
        if: env.RUN_FULL == 'true' && hashFiles('bench/run.lisp') != ''
        run: make bench-state || true

      - name: Disk usage (after)
        if: always()
        run: df -h / && du -sh /tmp/ansi-*.txt 2>/dev/null || true

      - name: Show results
        if: ${{ always() && env.RUN_FULL == 'true' }}
        run: |
          {
            echo "## ANSI Test Results"
            echo ""
            if [ -f /tmp/ansi-summary.txt ]; then
              echo '### Per-category (pass / elapsed / alloc)'
              echo '```'
              # Keep only result + TOTAL lines, drop build noise
              grep -E '^(cons|strings|sequences|data-and-control-flow|hash-tables|symbols|arrays|types-and-classes|characters|pathnames|files|system-construction|iteration|eval-and-compile|conditions|printer|environment|structures|packages|objects|reader|numbers|streams|misc):|^TOTAL:|^GC TOTAL:' /tmp/ansi-summary.txt
              echo '```'
              echo ''
            fi
            if [ -f ansi-state.json ]; then
              echo '```json'
              cat ansi-state.json
              echo '```'
            else
              echo "ansi-state.json not generated"
            fi
            echo ""
            echo "## Failed Tests (details)"
            echo ""
            if [ -s /tmp/ansi-failures.txt ]; then
              echo '```'
              head -1000 /tmp/ansi-failures.txt
              echo '```'
            else
              echo "No failures found in output files"
            fi
            echo ""
            echo "## Benchmark Results"
            echo ""
            if [ -f bench-state.json ]; then
              echo '```json'
              cat bench-state.json
              echo '```'
            else
              echo "bench-state.json not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
