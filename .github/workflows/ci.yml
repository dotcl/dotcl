      # The only test that actually builds projects the way a user does; a Lisp
      # library consumed by a plain C# app and by a dotcl app, through MSBuild.
      # Everything above tests the compiler and the runtime; this tests the
      # shipping path, and it was red for an unknown length of time because
      # nothing ran it: the build silently compiled a same-named system from
      # somewhere else in the tree instead of the project's own sources. ~2 min.
      # Needs the fasl core, which the target builds if absent.
      - name: Project composition (MSBuild consumers)
        run: make compile-core-fasl test-project-compose

      # The gates below were in the Makefile but in no workflow. That is not a
      # theoretical gap: an audit of `make` targets against the workflows found 6
      # of 17 test targets wired, and the very first unwired one run by hand was
      # RED -- with-standard-io-syntax had been bent away from CLHS to keep an
      # ANSI test green, and the test that says so had never executed here.
      #
      # Measured on the nightly of 2026-09-13, they cost 5m34s together
      # (project-compose 1m54 incl. compile-core-fasl, save-class-lib 1m35,
      # project-core-build 59s, core-bytes 30s, debug-pdb 23s, host-api 13s).
      # They ran on every push until 2026-09-29 and now run in the full run
      # (this job and the other full-* jobs): by then they cost ~7 min per push
      # and none of them had ever caught a real defect on a push. They still run in both
      # repositories; a breakage they catch shows within 12 hours.

      # The embedding API a C# host meets: EnsureCore with no prior Initialize,
      # a function named the way it is spelled in the Lisp source, and a host
      # with dynamic code disabled getting a Lisp condition rather than a raw
      # PlatformNotSupportedException. Builds and runs a real C# host in both
      # configurations. ~20s.
      - name: Embedding API (C# host)
        run: make test-host-api

      # dotcl emits a .NET class library that a separate C# project references at
      # COMPILE time (interface implemented on the C# side, delegate invoked).
      # Nothing else here compiles C# against dotcl-emitted metadata. ~70s.
      - name: save-class-library (C# consumes emitted metadata)
        run: make test-save-class-lib

      # A C# host (knows nothing of dotcl) loads a C# plugin and a Common Lisp plugin
      # baked into a DLL, from a folder, through AssemblyLoadContext. ~15s.
      - name: plugin host sample (C# host, Lisp plugin)
        run: make test-plugin-host-demo

      - name: Disk usage (after)
        if: always()
        run: df -h / && du -sh out/ansi 2>/dev/null || true

      - name: Memory peak (informational)
        if: always()
        run: sh scripts/ci-memory-report.sh

  # -- A red scheduled run opens an issue --------------------------------------
  # Nobody watches a run started by the clock. Opens an issue on the first red
  # scheduled run and comments on it after that, until someone closes it.
  # Never on the public mirror, which has no scheduled runs anyway.
  report-scheduled-failure:
    needs: [test, full-interp, full-emitfree, full-pack, full-ansi-bench, full-selfhost, full-hosts, playground]
    if: always() && github.event_name == 'schedule' && github.repository != 'dotcl/dotcl' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          get() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          title="Scheduled full CI run failed"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          failed=$(get "$api/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            | jq -r '.jobs[] | .name as $j | (.steps // [])[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "- \($j): \(.name) (\(.conclusion))"')
          body=$(printf '%s, commit %s\n%s\n\n%s\n' "$(date -u '+%Y-%m-%d %H:%M UTC')" "$GITHUB_SHA" "$run_url" "${failed:-(no failed step found; see the run)}")
          num=$(get "$api/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            | jq -r --arg t "$title" '[.[] | select(.title == $t and (.pull_request | not))][0].number // empty')
          if [ -n "$num" ]; then
            jq -n --arg b "$body" '{body: $b}' | get -X POST "$api/issues/$num/comments" -d @- >/dev/null
            echo "commented on issue $num"
          else
            jq -n --arg t "$title" --arg b "Close when the scheduled full run is green again.

          $body" '{title: $t, body: $b}' | get -X POST "$api/issues" -d @- | jq -r '"opened issue \(.number)"'
          fi

  # -- browser-wasm playground, full run only ---------------------------------
  # `dotnet publish` of a browser-wasm app succeeds while the page hangs or
  # dies at boot, so only a browser tells. Builds dotcl/playground against this
  # checkout and requires its probe to report `status: ready`.
  playground:
    # After the shortest full-run job, so it takes the runner that job frees
    # instead of making a long job wait for one; always(), so a red there does
    # not skip it.
    needs: full-selfhost
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.repository == 'dotcl/dotcl' && github.event_name == 'push'))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prune old NuGet packages
        if: runner.environment != 'github-hosted'
        run: dotnet run ci/prune-nuget.cs

      # As in the test job.
      - name: Free disk space
        if: runner.environment != 'github-hosted'
        run: |
          avail_kb=$(df -Pk / | awk 'NR == 2 { print $4 }')
          echo "$((avail_kb / 1024)) MB free on /"
          if [ "$avail_kb" -lt $((5 * 1024 * 1024)) ]; then
            echo "::error::Less than 5 GB free on /"
            df -h /
            du -sh "$HOME"/.nuget/packages/* 2>/dev/null | sort -rh | head -20
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Roswell
        run: |
          if ! command -v ros >/dev/null && [ ! -x "$HOME/.roswell/bin/ros" ]; then
            curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          fi
          echo "$HOME/.roswell/bin" >> $GITHUB_PATH

      - name: Build the core
        run: make cross-compile compiler/dotcl.core

      - name: Install the wasm workloads
        run: dotnet workload install wasm-tools wasm-experimental

      - name: Publish the playground against this checkout
        run: |
          git clone --depth 1 https://github.com/dotcl/playground "$RUNNER_TEMP/playground"
          dotnet publish "$RUNNER_TEMP/playground/src/Playground.csproj" -c Release \
            -p:DotclSource="$GITHUB_WORKSPACE/runtime/DotCL.Runtime.csproj" -p:WasmEnableSIMD=false

      # Installed once on a runner that lacks it (the deb pulls in the libraries
      # headless Chrome needs); GitHub-hosted images already have it.
      - name: Install Chrome
        run: |
          if ! command -v google-chrome >/dev/null; then
            curl -fsSL -o "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo -n apt-get install -y "$RUNNER_TEMP/chrome.deb"
          fi
          google-chrome --version
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome-wrapper"
          chmod +x "$RUNNER_TEMP/chrome-wrapper"

      - name: Boot the playground in headless Chrome
        run: |
          bundle=$(find "$RUNNER_TEMP/playground/src/bin/Release" -type d -name AppBundle | head -n 1)
          test -n "$bundle"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$bundle" > "$RUNNER_TEMP/http.log" 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 2
          CHROME="$RUNNER_TEMP/chrome-wrapper" node "$RUNNER_TEMP/playground/tools/probe-page.mjs" \
            http://127.0.0.1:8080/playground.html '(lisp-implementation-version)' | tee "$RUNNER_TEMP/probe.txt"
          grep -qx 'status   : ready' "$RUNNER_TEMP/probe.txt"
          grep -q '^output   : ' "$RUNNER_TEMP/probe.txt"
          ! grep -q 'TIMED OUT' "$RUNNER_TEMP/probe.txt"

