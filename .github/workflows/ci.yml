          EOF
          echo "BASH_ENV=$RUNNER_TEMP/step-env.sh" >> "$GITHUB_ENV"

      - name: Setup Roswell
        run: |
          if ! command -v ros >/dev/null && [ ! -x "$HOME/.roswell/bin/ros" ]; then
