name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # ── Job 1: run regression tests (subset of CI) ──────────────────────────
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Roswell
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> $GITHUB_PATH

      # Build smoke only. Regression + ANSI already gated on every master push
      # (ci.yml) and locally before tagging; re-running the full regression here
      # is redundant. Tags are cut from validated local state, so this job just
      # confirms the release artifacts still cross-compile + build on ubuntu.
      - name: Cross-compile
        run: make cross-compile

      - name: Build
        run: make build

  # ── Job 2: build nupkg + tbz and create GitHub Release ──────────────────
  release:
    needs: test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write   # required by softprops/action-gh-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Roswell
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> $GITHUB_PATH

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch on a branch — use a sentinel version so pack
            # produces a recognisably-not-a-real-release artifact.
            echo "VERSION=0.0.0-dispatch" >> "$GITHUB_OUTPUT"
          fi

      # ── Compiler SIL output ──────────────────────────────────────────────
      - name: Cross-compile (generate cil-out.sil)
        run: make cross-compile

      # ── FASL artifacts ───────────────────────────────────────────────────
      # compile-core-fasl: cil-out.sil → compiler/dotcl.core (PE assembly)
      - name: Compile core FASL
        run: make compile-core-fasl

      # compile-asdf-fasl: contrib/asdf/asdf.lisp → contrib/asdf/asdf.fasl
      - name: Compile asdf FASL
        run: make compile-asdf-fasl

      # contrib-dotcl-cs: publish Roslyn helper DLL into contrib/dotcl-cs/lib/
      - name: Build dotcl-cs contrib
        run: make contrib-dotcl-cs

      # ── R2R (ReadyToRun) FASL artifacts ──────────────────────────────────
      # crossgen2 the core / asdf / contrib fasls per RID so the tbz distribution
      # ships pre-native FASLs (cold RunCore ~3.37s → ~50ms). crossgen2
      # cross-compiles from the ubuntu host for every target RID. Runs before the
      # contrib staging below so the <name>-r2r-<rid>.fasl land in runtime/contrib.
      - name: Compile R2R FASLs (per RID)
        run: make compile-core-fasl-r2r-all compile-asdf-fasl-r2r-all compile-contrib-fasls-r2r-all

      # ── Stage runtime/contrib/ (mirrors the pack target) ─────────────────
      - name: Stage contrib for packing
        run: |
          rm -rf runtime/contrib
          cp compiler/dotcl.core runtime/dotcl.core
          mkdir -p runtime/contrib/asdf
          cp -r contrib/*/ runtime/contrib/
          rm -f runtime/contrib/asdf/asdf.lisp runtime/contrib/asdf/asdf.sil
          rm -rf runtime/contrib/dotcl-cs/bin runtime/contrib/dotcl-cs/obj
          rm -f runtime/contrib/dotcl-cs/*.csproj runtime/contrib/dotcl-cs/*.cs
          cp contrib/asdf/asdf.fasl runtime/contrib/asdf/asdf.fasl

      # ── dotnet pack: base pointer + per-RID R2R tool packages in one pass ──
      # Mirror `make pack`: stage all 6 desktop R2R cores at runtime/ top level and run
      # ONE `dotnet pack` over the desktop RID list + `any`. That single pack emits the
      # base pointer (a DotnetToolSettings.xml, path per SDK) enumerating EVERY listed
      # RID PLUS a dotcl.<rid> R2R package each, so `dotnet tool install -g dotcl` selects
      # the host's fast (~0.16s) R2R build. The old `-p:RuntimeIdentifiers=any` override
      # listed only `any` in the pointer, so installs fell back to the slow (~1.8s) non-R2R
      # `any` build and the per-RID R2R packages were orphaned. PublishReadyToRun
      # defaults to true in the csproj (R2R applies per-RID; `any` stays IL). android RIDs
      # are intentionally excluded here (release deferral).
      - name: Pack NuGet packages
        run: |
          mkdir -p out
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            cp compiler/dotcl-r2r-$rid.core runtime/dotcl-r2r-$rid.core
            cp contrib/asdf/asdf-r2r-$rid.fasl runtime/asdf-r2r-$rid.fasl
          done
          # asdf is the one contrib whose R2R copy is overlaid from runtime/ top level
          # (ReplaceFaslsWithR2R reads asdf-r2r-<rid>.fasl), so its copies under
          # contrib/asdf/ are dead weight in every package. The other contribs keep
          # their per-RID R2R here: the csproj drops the cross-RID ones and adds back
          # the RID being packed.
          rm -f runtime/contrib/asdf/asdf-r2r-*.fasl
          # Exclude android via the csproj's DotclToolNoAndroid hook — it rewrites
          # <RuntimeIdentifiers> to the 6 desktop RIDs + `any` inside the project. A
          # ;-list cannot be passed as a command-line -p:RuntimeIdentifiers (bare ; ->
          # MSB1006; %3B -> NETSDK1083 single-RID), so the flag carries the intent and
          # the literal list lives in XML.
          dotnet pack runtime/runtime.csproj \
            --configuration Release \
            -o out/ \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:DotclToolNoAndroid=true
          # Drop the staged per-RID cores; the tbz publish below stages its own (from
          # compiler/), so runtime/ should be clean of them first.
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            rm -f runtime/dotcl-r2r-$rid.core runtime/asdf-r2r-$rid.fasl
          done
          # Build the in-process project-core MSBuild task FIRST so the library
          # pack bundles tasks/DotCL.Build.Tasks.dll. DotCL.Runtime.csproj
          # includes it with Condition="Exists(...)", so if the task is not built
          # the pack silently omits it and ships a broken project-core build
          # (MSB4036 for <DotclProjectAsd> consumers — was the 0.1.12 regression).
          dotnet build runtime/build-tasks/DotCL.Build.Tasks.csproj --configuration Release
          dotnet pack runtime/DotCL.Runtime.csproj \
            --configuration Release \
            -o out/ \
            -p:Version=${{ steps.version.outputs.VERSION }}

      # ── Pack DotCL.Sdk (MSBuild SDK) + dotcl-app templates ───────────────
      # The flagship developer experience: `dotnet new dotcl-app` (template) and
      # `<Project Sdk="DotCL.Sdk">` (build/F5-debug). Both reference the runtime
      # version stamped into Sdk.props / template.json by `make set-version`, kept
      # in lockstep with this package version. They land in out/, so the Release
      # upload and the nuget-publish push (both out/*.nupkg globs) pick them up.
      - name: Pack DotCL.Sdk and dotcl-app templates
        run: |
          dotnet pack runtime/sdk/DotCL.Sdk.csproj \
            --configuration Release \
            -o out/ \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet pack templates/DotCL.Templates.csproj \
            --configuration Release \
            -o out/ \
            -p:Version=${{ steps.version.outputs.VERSION }}

      # ── Guard: fail the release if the project-core task didn't get bundled ──
      - name: Verify project-core task is bundled
        run: |
          VER=${{ steps.version.outputs.VERSION }}
          nupkg="out/DotCL.Runtime.$VER.nupkg"
          if unzip -l "$nupkg" | grep -q 'tasks/DotCL.Build.Tasks.dll'; then
            echo "OK: tasks/DotCL.Build.Tasks.dll present in $nupkg"
          else
            echo "ERROR: $nupkg is missing tasks/DotCL.Build.Tasks.dll"
            echo " project-core build would fail with MSB4036 for consumers."
            exit 1
          fi

      # ── Guard: the base tool pointer must enumerate every per-RID package ──
      # If it lists only `any`, `dotnet tool install -g dotcl` picks the slow non-R2R
      # build and the per-RID R2R packages are orphaned. Fail the release loudly.
      - name: Verify tool pointer enumerates all RIDs
        run: |
          VER=${{ steps.version.outputs.VERSION }}
          nupkg="out/dotcl.$VER.nupkg"
          # Where the SDK puts the pointer inside the package is the SDK's business,
          # and it moved: 10.0.302 wrote tools/net10.0/any/DotnetToolSettings.xml,
          # 10.0.400 writes tools/any/any/. The file itself is byte-identical and a
          # 10.0.302 client installs 10.0.400 output correctly (both resolve the
          # host RID package rather than falling back to `any`; measured), so what
          # this guard cares about is the RID list, not the path. Find the entry.
          entry=$(unzip -Z1 "$nupkg" | grep -E '(^|/)DotnetToolSettings\.xml$' | head -1)
          if [ -z "$entry" ]; then
            echo "ERROR: $nupkg carries no DotnetToolSettings.xml — not a tool pointer package"
            unzip -Z1 "$nupkg"
            exit 1
          fi
          xml=$(unzip -p "$nupkg" "$entry")
          missing=""
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            echo "$xml" | grep -q "RuntimeIdentifier=\"$rid\"" || missing="$missing $rid"
          done
          if [ -n "$missing" ]; then
            echo "ERROR: $nupkg tool pointer is missing RIDs:$missing"
            echo "  dotnet tool install -g dotcl would fall back to the slow non-R2R any build."
            echo "$xml"
            exit 1
          fi
          echo "OK: pointer ($entry) enumerates all desktop RIDs — R2R install works"

      # ── Guard: no package may carry another RID's R2R payload ────────────
      # One pack pass emits every package from a staging dir that holds all six
      # RIDs' R2R fasls, so a filtering mistake is invisible until someone lists
      # a published nupkg (0.1.23 and 0.1.24 shipped 70 stray files / 22 MB each).
      - name: Verify per-RID packages carry only their own R2R
        run: |
          VER=${{ steps.version.outputs.VERSION }}
          fail=0
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64 any; do
            nupkg="out/dotcl.$rid.$VER.nupkg"
            if [ ! -f "$nupkg" ]; then
              echo "ERROR: $nupkg was not produced"
              fail=1
              continue
            fi
            # `any` is framework-dependent: it must carry no R2R payload at all.
            if [ "$rid" = any ]; then
              stray=$(unzip -Z1 "$nupkg" | grep -- '-r2r-' || true)
            else
              stray=$(unzip -Z1 "$nupkg" | grep -- '-r2r-' | grep -v -- "-r2r-$rid\." || true)
            fi
            if [ -n "$stray" ]; then
              echo "ERROR: $nupkg carries R2R payload belonging to other RIDs:"
              echo "$stray"
              fail=1
            else
              echo "OK: $nupkg"
            fi
          done
          [ "$fail" = 0 ] || exit 1

      # (The per-RID R2R tool nupkgs — dotcl.<rid> — are now produced by the single
      #  multi-RID `dotnet pack` in "Pack NuGet packages" above, together with a base
      #  pointer that enumerates every RID. A separate per-RID `-p:RuntimeIdentifier=$rid`
      #  loop is no longer needed and would only duplicate those packages.)

      # ── Per-RID tbz for Roswell (R2R) ────────────────────────────────────
      # dotnet publish -r <rid> --self-contained false cross-compiles on Linux
      # for all 6 RIDs. PublishReadyToRun=true crossgens the runtime assembly to
      # native; dotcl.core / asdf.fasl are injected as the per-RID R2R FASLs, and
      # this RID's contrib R2R fasls (<name>-r2r-<rid>.fasl) ride along in the
      # publish output for the resolve-deps probe.
      - name: Build per-RID tbz
        run: |
          VER=${{ steps.version.outputs.VERSION }}
          mkdir -p out
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            echo "=== publishing $rid (R2R) ==="
            dotnet publish runtime/runtime.csproj \
              -c Release -r $rid --self-contained false \
              -p:Version=$VER \
              -p:PublishReadyToRun=true \
              -o out/publish-$rid/
            # publish already carries contrib/ (the csproj's Content items, with the
            # cross-RID R2R fasls filtered out), so only the two artifacts that live
            # outside runtime/contrib are injected here. The former
            # `cp -r runtime/contrib out/publish-$rid/contrib` did two wrong things:
            # the destination already existed, so cp created contrib/contrib (a full
            # second copy of every contrib), and that copy came from the staging dir
            # holding all six RIDs' R2R fasls.
            cp compiler/dotcl-r2r-$rid.core out/publish-$rid/dotcl.core
            cp contrib/asdf/asdf-r2r-$rid.fasl out/publish-$rid/contrib/asdf/asdf.fasl
            chmod +x out/publish-$rid/runtime 2>/dev/null || true
            # Guard: one contrib tree, and no other RID's R2R fasls in it.
            if [ -d out/publish-$rid/contrib/contrib ]; then
              echo "ERROR: $rid payload nests a second contrib tree under contrib/contrib"
              exit 1
            fi
            stray=$(find out/publish-$rid -name '*-r2r-*' ! -name "*-r2r-$rid.*")
            if [ -n "$stray" ]; then
              echo "ERROR: $rid payload carries cross-RID R2R artifacts:"
              echo "$stray"
              exit 1
            fi
            tar -cjf out/dotcl-$rid-$VER.tar.bz2 -C out/publish-$rid .
            size=$(du -h out/dotcl-$rid-$VER.tar.bz2 | awk '{print $1}')
            echo "==> out/dotcl-$rid-$VER.tar.bz2 ($size)"
            rm -rf out/publish-$rid
          done

      # ── Clean up staged runtime files ────────────────────────────────────
      - name: Clean staged artifacts from runtime/
        run: |
          rm -f runtime/dotcl.core
          rm -rf runtime/contrib

      # ── Create GitHub Release and upload nupkg + tbz ─────────────────────
      # Tag push only. Skipped for workflow_dispatch (manual / experiment).
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.nupkg
            out/*.tar.bz2
          generate_release_notes: true

